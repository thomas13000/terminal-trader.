<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.A.R.V.I.S. — QUANTUM MARKETS</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;500;700;800&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <style>
        :root {
            --cyan-core: #00f3ff;
            --cyan-glow: rgba(0, 243, 255, 0.4);
            --blue-deep: #0066ff;
            --bg-dark: #040810;
            --bg-glass: rgba(6, 16, 32, 0.75);
            --border-hud: rgba(0, 243, 255, 0.3);
            --text-main: #d0f8ff;
            --text-muted: #52788d;
            --green-up: #00ffaa;
            --red-down: #ff3366;
            --font-display: 'Orbitron', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }

        body, html {
            width: 100%; height: 100%; overflow: hidden;
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: var(--font-mono);
        }

        #webgl-canvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; }

        /* HUD Overlay HUD Jarvis Grid */
        .jarvis-grid {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 2; pointer-events: none;
            background: 
                radial-gradient(circle at 50% 50%, transparent 20%, rgba(4, 8, 16, 0.92) 85%),
                linear-gradient(to right, rgba(0, 243, 255, 0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(0, 243, 255, 0.03) 1px, transparent 1px);
            background-size: 100% 100%, 40px 40px, 40px 40px;
        }

        /* Reticles JARVIS */
        .reticle { position: fixed; width: 40px; height: 40px; border: 2px solid var(--cyan-core); opacity: 0.6; pointer-events: none; z-index: 10; }
        .r-tl { top: 20px; left: 20px; border-right: 0; border-bottom: 0; }
        .r-tr { top: 20px; right: 20px; border-left: 0; border-bottom: 0; }
        .r-bl { bottom: 20px; left: 20px; border-right: 0; border-top: 0; }
        .r-br { bottom: 20px; right: 20px; border-left: 0; border-top: 0; }

        /* Top Banner */
        .jarvis-header {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            width: calc(100vw - 80px); max-width: 1500px; z-index: 20;
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px 24px; background: var(--bg-glass);
            border: 1px solid var(--border-hud); border-radius: 8px;
            backdrop-filter: blur(12px); box-shadow: 0 0 25px rgba(0, 243, 255, 0.15);
            transition: all 0.6s ease;
        }

        .header-title { font-family: var(--font-display); font-size: 1.1rem; color: #fff; letter-spacing: 3px; display: flex; align-items: center; gap: 10px; }
        .header-title span { color: var(--cyan-core); text-shadow: 0 0 10px var(--cyan-glow); }

        /* Clocks Section */
        .clocks-container { display: flex; gap: 20px; }
        .clock-box { text-align: right; }
        .clock-label { font-size: 0.6rem; color: var(--text-muted); letter-spacing: 1px; }
        .clock-val { font-size: 0.95rem; font-weight: 700; color: var(--cyan-core); }

        /* Left Control Panel */
        .control-panel {
            position: fixed; top: 100px; left: 40px; width: 340px; z-index: 20;
            background: var(--bg-glass); border: 1px solid var(--border-hud);
            border-radius: 12px; padding: 20px; backdrop-filter: blur(12px);
            display: flex; flex-direction: column; gap: 16px;
            transition: all 0.6s ease;
        }

        .panel-status { display: flex; justify-content: space-between; font-size: 0.7rem; color: var(--text-muted); border-bottom: 1px solid var(--border-hud); padding-bottom: 8px; }
        .status-online { color: var(--green-up); font-weight: bold; }

        .btn-jarvis-launch {
            background: rgba(0, 243, 255, 0.1);
            border: 1px solid var(--cyan-core);
            color: var(--cyan-core);
            padding: 16px; font-family: var(--font-display);
            font-size: 0.85rem; font-weight: 900; letter-spacing: 2px;
            border-radius: 6px; cursor: pointer;
            box-shadow: 0 0 15px var(--cyan-glow);
            transition: all 0.3s ease;
            text-transform: uppercase;
        }

        .btn-jarvis-launch:hover {
            background: var(--cyan-core); color: #000;
            box-shadow: 0 0 30px var(--cyan-core);
        }

        /* Right Market Panel */
        .market-panel {
            position: fixed; top: 100px; right: 40px; width: 360px; z-index: 20;
            display: flex; flex-direction: column; gap: 10px;
            transition: all 0.6s ease;
        }

        .ticker-row {
            background: var(--bg-glass); border: 1px solid var(--border-hud);
            border-left: 3px solid var(--cyan-core); border-radius: 6px;
            padding: 10px 14px; backdrop-filter: blur(12px);
            display: flex; justify-content: space-between; align-items: center;
        }

        .ticker-sym { font-family: var(--font-display); font-size: 0.85rem; color: #fff; }
        .ticker-name { font-size: 0.65rem; color: var(--text-muted); }
        .sparkline { width: 70px; height: 24px; }
        .price-val { font-size: 0.85rem; font-weight: 700; text-align: right; }
        .price-chg { font-size: 0.65rem; text-align: right; }

        .up { color: var(--green-up); }
        .down { color: var(--red-down); }

        /* Mode Transition WARP */
        .warping .jarvis-header { transform: translate(-50%, -150%); opacity: 0; }
        .warping .control-panel { transform: translateX(-150%); opacity: 0; }
        .warping .market-panel { transform: translateX(150%); opacity: 0; }

        #flash-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: var(--cyan-core); opacity: 0; pointer-events: none; z-index: 999;
        }
    </style>
</head>
<body>

    <div id="flash-overlay"></div>
    <canvas id="webgl-canvas"></canvas>
    <div class="jarvis-grid"></div>

    <div class="reticle r-tl"></div><div class="reticle r-tr"></div>
    <div class="reticle r-bl"></div><div class="reticle r-br"></div>

    <header class="jarvis-header">
        <div class="header-title">
            <span>❖ J.A.R.V.I.S.</span> MARKETS SYSTEM
        </div>
        <div class="clocks-container">
            <div class="clock-box">
                <div class="clock-label">PARIS (UTC+2)</div>
                <div class="clock-val" id="clk-paris">00:00:00</div>
            </div>
            <div class="clock-box">
                <div class="clock-label">NEW YORK (EST)</div>
                <div class="clock-val" id="clk-ny">00:00:00</div>
            </div>
            <div class="clock-box">
                <div class="clock-label">TOKYO (JST)</div>
                <div class="clock-val" id="clk-tokyo">00:00:00</div>
            </div>
        </div>
    </header>

    <div class="control-panel">
        <div class="panel-status">
            <span>SYSTEME AI: <span class="status-online">ACTIF</span></span>
            <span>LATENCE: <span id="ping-num" style="color:var(--cyan-core)">12ms</span></span>
        </div>
        <div style="font-size:0.75rem; color:var(--text-main); line-height:1.4;">
            Verrouillage orbital prêt. Module d'analyse prédictif connecté au flux boursier mondial.
        </div>
        <button class="btn-jarvis-launch" id="btn-launch">Initialiser la Séquence</button>
    </div>

    <div class="market-panel" id="ticker-list"></div>

    <script>
        // Renomme ton fichier localement 'acdc.mp3' à la racine de ton dossier
        const acdcAudio = new Audio('acdc.mp3');

        // HORLOGES TEMPS RÉEL (Correctement corrigées)
        function refreshClocks() {
            const now = new Date();
            document.getElementById('clk-paris').textContent = now.toLocaleTimeString('fr-FR', { timeZone: 'Europe/Paris', hour12: false });
            document.getElementById('clk-ny').textContent = now.toLocaleTimeString('en-US', { timeZone: 'America/New_York', hour12: false });
            document.getElementById('clk-tokyo').textContent = now.toLocaleTimeString('ja-JP', { timeZone: 'Asia/Tokyo', hour12: false });
            document.getElementById('ping-num').textContent = (10 + Math.floor(Math.random() * 6)) + 'ms';
        }
        setInterval(refreshClocks, 1000);
        refreshClocks();

        // DONNÉES DE MARCHÉ DYNAMIQUES ET COMPLÈTES
        const marketData = [
            { sym: 'BTC/USD', name: 'Bitcoin Core', price: 96850.20, chg: '+3.42%', up: true },
            { sym: 'ETH/USD', name: 'Ethereum', price: 2740.80, chg: '+2.15%', up: true },
            { sym: 'NASDAQ', name: 'US Tech 100', price: 21240.50, chg: '-0.45%', up: false },
            { sym: 'GOLD', name: 'Gold Ounce', price: 2860.10, chg: '+0.88%', up: true },
            { sym: 'EUR/USD', name: 'Euro Dollar', price: 1.0485, chg: '-0.12%', up: false }
        ];

        function initMarketPanel() {
            const container = document.getElementById('ticker-list');
            container.innerHTML = '';
            marketData.forEach((item, idx) => {
                const card = document.createElement('div');
                card.className = 'ticker-row';
                card.innerHTML = `
                    <div>
                        <div class="ticker-sym">${item.sym}</div>
                        <div class="ticker-name">${item.name}</div>
                    </div>
                    <canvas class="sparkline" id="spark-${idx}"></canvas>
                    <div>
                        <div class="price-val" id="price-${idx}">${item.price.toLocaleString()}</div>
                        <div class="price-chg ${item.up ? 'up' : 'down'}">${item.chg}</div>
                    </div>
                `;
                container.appendChild(card);
                drawSparkline(`spark-${idx}`, item.up);
            });
        }

        function drawSparkline(canvasId, isUp) {
            const cvs = document.getElementById(canvasId);
            if (!cvs) return;
            const ctx = cvs.getContext('2d');
            cvs.width = 70; cvs.height = 24;
            ctx.strokeStyle = isUp ? '#00ffaa' : '#ff3366';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            let y = 12;
            ctx.moveTo(0, y);
            for (let x = 5; x <= 70; x += 7) {
                y += (Math.random() - 0.48) * 8;
                y = Math.max(3, Math.min(21, y));
                ctx.lineTo(x, y);
            }
            ctx.stroke();
        }

        initMarketPanel();

        // Mettre à jour périodiquement les prix pour simuler un vrai direct
        setInterval(() => {
            marketData.forEach((item, i) => {
                const delta = (Math.random() - 0.49) * (item.price * 0.002);
                item.price += delta;
                const el = document.getElementById(`price-${i}`);
                if (el) el.textContent = item.price.toFixed(item.price < 10 ? 4 : 2);
            });
        }, 2000);

        // THREE.JS - SCÈNE STYLE JARVIS HOLOGRAMME
        const canvas = document.getElementById('webgl-canvas');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 30);

        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        const jarvisGroup = new THREE.Group();
        scene.add(jarvisGroup);

        // Sphère centrale Holo
        const sphereGeo = new THREE.SphereGeometry(7.5, 48, 48);
        const sphereMat = new THREE.MeshBasicMaterial({
            color: 0x00f3ff, wireframe: true, transparent: true, opacity: 0.15
        });
        const sphereMesh = new THREE.Mesh(sphereGeo, sphereMat);
        jarvisGroup.add(sphereMesh);

        // Anneaux concentriques JARVIS Arc Reactor
        function createRing(radius, color, speedX, speedY) {
            const ringGeo = new THREE.RingGeometry(radius, radius + 0.12, 64);
            const ringMat = new THREE.MeshBasicMaterial({ color, side: THREE.DoubleSide, transparent: true, opacity: 0.7 });
            const ring = new THREE.Mesh(ringGeo, ringMat);
            ring.userData = { speedX, speedY };
            jarvisGroup.add(ring);
            return ring;
        }

        const rings = [
            createRing(8.8, 0x00f3ff, 0.005, 0.01),
            createRing(9.6, 0x0066ff, -0.008, 0.004),
            createRing(10.5, 0x00f3ff, 0.002, -0.009)
        ];

        // Particules flottantes
        const pGeo = new THREE.BufferGeometry();
        const pCount = 1200;
        const pPos = new Float32Array(pCount * 3);
        for (let i = 0; i < pCount * 3; i++) {
            pPos[i] = (Math.random() - 0.5) * 40;
        }
        pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
        const pMat = new THREE.PointsMaterial({ size: 0.1, color: 0x00f3ff, transparent: true, opacity: 0.5 });
        const particles = new THREE.Points(pGeo, pMat);
        scene.add(particles);

        // ANIMATION & TRANSITION CINÉMATIQUE
        let isWarping = false;
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            const time = clock.getElapsedTime();

            if (!isWarping) {
                jarvisGroup.rotation.y = time * 0.15;
                rings.forEach(r => {
                    r.rotation.x += r.userData.speedX;
                    r.rotation.y += r.userData.speedY;
                });
            }
            particles.rotation.y = time * 0.03;
            renderer.render(scene, camera);
        }
        animate();

        // LANCEMENT DE LA SÉQUENCE
        document.getElementById('btn-launch').addEventListener('click', () => {
            if (isWarping) return;
            isWarping = true;
            document.body.classList.add('warping');

            // Lecture Audio
            acdcAudio.currentTime = 0;
            acdcAudio.play().catch(e => console.log('Bloqué par navigateur:', e));

            const flash = document.getElementById('flash-overlay');
            let startTime = performance.now();

            function warpStep(now) {
                let progress = (now - startTime) / 3500; // 3.5 secondes
                if (progress < 1.0) {
                    camera.position.z = 30 - Math.pow(progress, 3) * 22;
                    camera.fov = 45 + progress * 35;
                    camera.updateProjectionMatrix();
                    jarvisGroup.rotation.y += progress * 0.2;

                    if (progress > 0.85) {
                        flash.style.opacity = (progress - 0.85) / 0.15;
                    }
                    requestAnimationFrame(warpStep);
                } else {
                    flash.style.opacity = '1';
                    setTimeout(() => {
                        alert('CONNEXION JARVIS ÉTABLIE — SYSTÈME PRÊT');
                        location.reload();
                    }, 300);
                }
            }
            requestAnimationFrame(warpStep);
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
