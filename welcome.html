<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.A.R.V.I.S. — GLOBAL QUANTUM TERMINAL</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;500;700;800&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <style>
        :root {
            --cyan-core: #00f3ff;
            --cyan-glow: rgba(0, 243, 255, 0.4);
            --blue-deep: #0055ff;
            --bg-dark: #02050b;
            --bg-glass: rgba(4, 12, 24, 0.82);
            --border-hud: rgba(0, 243, 255, 0.35);
            --text-main: #d0f8ff;
            --text-muted: #4a7288;
            --green-up: #00ffaa;
            --red-down: #ff3366;
            --font-display: 'Orbitron', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }

        body, html {
            width: 100%; height: 100%; overflow: hidden;
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: var(--font-mono);
        }

        #webgl-canvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; }

        .jarvis-grid {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 2; pointer-events: none;
            background: 
                radial-gradient(circle at 50% 50%, transparent 20%, rgba(2, 5, 11, 0.92) 85%),
                linear-gradient(to right, rgba(0, 243, 255, 0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(0, 243, 255, 0.03) 1px, transparent 1px);
            background-size: 100% 100%, 40px 40px, 40px 40px;
        }

        .reticle { position: fixed; width: 35px; height: 35px; border: 2px solid var(--cyan-core); opacity: 0.6; pointer-events: none; z-index: 10; }
        .r-tl { top: 20px; left: 20px; border-right: 0; border-bottom: 0; }
        .r-tr { top: 20px; right: 20px; border-left: 0; border-bottom: 0; }
        .r-bl { bottom: 20px; left: 20px; border-right: 0; border-top: 0; }
        .r-br { bottom: 20px; right: 20px; border-left: 0; border-top: 0; }

        .jarvis-header {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            width: calc(100vw - 80px); max-width: 1500px; z-index: 20;
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px 24px; background: var(--bg-glass);
            border: 1px solid var(--border-hud); border-radius: 8px;
            backdrop-filter: blur(12px); box-shadow: 0 0 25px rgba(0, 243, 255, 0.15);
            transition: all 0.6s ease;
        }

        .header-title { font-family: var(--font-display); font-size: 1rem; color: #fff; letter-spacing: 3px; display: flex; align-items: center; gap: 10px; }
        .header-title span { color: var(--cyan-core); text-shadow: 0 0 10px var(--cyan-glow); }

        .clocks-container { display: flex; gap: 24px; }
        .clock-box { text-align: right; }
        .clock-label { font-size: 0.6rem; color: var(--text-muted); letter-spacing: 1px; }
        .clock-val { font-size: 0.95rem; font-weight: 700; color: var(--cyan-core); }

        .control-panel {
            position: fixed; top: 100px; left: 40px; width: 340px; z-index: 20;
            background: var(--bg-glass); border: 1px solid var(--border-hud);
            border-radius: 12px; padding: 20px; backdrop-filter: blur(12px);
            display: flex; flex-direction: column; gap: 16px;
            transition: all 0.6s ease;
        }

        .panel-status { display: flex; flex-direction: column; gap: 6px; font-size: 0.75rem; border-bottom: 1px solid var(--border-hud); padding-bottom: 10px; }
        .status-row { display: flex; justify-content: space-between; }
        .status-online { color: var(--green-up); font-weight: bold; }

        .btn-jarvis-launch {
            background: rgba(0, 243, 255, 0.1);
            border: 1px solid var(--cyan-core);
            color: var(--cyan-core);
            padding: 16px; font-family: var(--font-display);
            font-size: 0.85rem; font-weight: 900; letter-spacing: 2px;
            border-radius: 6px; cursor: pointer;
            box-shadow: 0 0 15px var(--cyan-glow);
            transition: all 0.3s ease;
            text-transform: uppercase;
        }

        .btn-jarvis-launch:hover {
            background: var(--cyan-core); color: #000;
            box-shadow: 0 0 30px var(--cyan-core);
        }

        .market-panel {
            position: fixed; top: 100px; right: 40px; width: 360px; z-index: 20;
            display: flex; flex-direction: column; gap: 10px;
            transition: all 0.6s ease;
        }

        .ticker-row {
            background: var(--bg-glass); border: 1px solid var(--border-hud);
            border-left: 3px solid var(--cyan-core); border-radius: 6px;
            padding: 10px 14px; backdrop-filter: blur(12px);
            display: flex; justify-content: space-between; align-items: center;
        }

        .ticker-sym { font-family: var(--font-display); font-size: 0.85rem; color: #fff; }
        .ticker-name { font-size: 0.65rem; color: var(--text-muted); }
        .sparkline { width: 70px; height: 24px; }
        .price-val { font-size: 0.85rem; font-weight: 700; text-align: right; }
        .price-chg { font-size: 0.65rem; text-align: right; }

        .up { color: var(--green-up); }
        .down { color: var(--red-down); }

        .warping .jarvis-header { transform: translate(-50%, -150%); opacity: 0; }
        .warping .control-panel { transform: translateX(-150%); opacity: 0; }
        .warping .market-panel { transform: translateX(150%); opacity: 0; }

        #flash-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: var(--cyan-core); opacity: 0; pointer-events: none; z-index: 999;
        }
    </style>
</head>
<body>

    <div id="flash-overlay"></div>
    <canvas id="webgl-canvas"></canvas>
    <div class="jarvis-grid"></div>

    <div class="reticle r-tl"></div><div class="reticle r-tr"></div>
    <div class="reticle r-bl"></div><div class="reticle r-br"></div>

    <header class="jarvis-header">
        <div class="header-title">
            <span>❖ J.A.R.V.I.S.</span> GLOBAL MAPPER
        </div>
        <div class="clocks-container">
            <div class="clock-box">
                <div class="clock-label">PARIS (UTC+2)</div>
                <div class="clock-val" id="clk-paris">00:00:00</div>
            </div>
            <div class="clock-box">
                <div class="clock-label">NEW YORK (EST)</div>
                <div class="clock-val" id="clk-ny">00:00:00</div>
            </div>
            <div class="clock-box">
                <div class="clock-label">TOKYO (JST)</div>
                <div class="clock-val" id="clk-tokyo">00:00:00</div>
            </div>
        </div>
    </header>

    <div class="control-panel">
        <div class="panel-status">
            <div class="status-row">
                <span>RÉSEAU :</span>
                <span class="status-online">CONNECTÉ</span>
            </div>
            <div class="status-row">
                <span>AUDIO ACDC :</span>
                <span id="audio-status" style="color:var(--text-muted)">CHARGEMENT...</span>
            </div>
            <div class="status-row">
                <span>LATENCE :</span>
                <span id="ping-num" style="color:var(--cyan-core)">11ms</span>
            </div>
        </div>
        <div style="font-size:0.72rem; color:var(--text-main); line-height:1.4;">
            Cartographie continentale vectorielle active. Flux boursiers synchronisés en direct.
        </div>
        <button class="btn-jarvis-launch" id="btn-launch">Initialiser la Séquence</button>
    </div>

    <div class="market-panel" id="ticker-list"></div>

    <script>
        // GESTION AUDIO AVEC DIAGNOSTIC INTELLIGENT
        const acdcAudio = new Audio('./acdc.mp3');
        acdcAudio.preload = 'auto';

        const audioStatusEl = document.getElementById('audio-status');

        acdcAudio.addEventListener('canplaythrough', () => {
            audioStatusEl.textContent = 'PRÊT';
            audioStatusEl.style.color = 'var(--green-up)';
        });

        acdcAudio.addEventListener('error', () => {
            audioStatusEl.textContent = 'INTROUVABLE (acdc.mp3)';
            audioStatusEl.style.color = 'var(--red-down)';
        });

        // HORLOGES TEMPS RÉEL EXACTES
        function refreshClocks() {
            const now = new Date();
            document.getElementById('clk-paris').textContent = now.toLocaleTimeString('fr-FR', { timeZone: 'Europe/Paris', hour12: false });
            document.getElementById('clk-ny').textContent = now.toLocaleTimeString('en-US', { timeZone: 'America/New_York', hour12: false });
            document.getElementById('clk-tokyo').textContent = now.toLocaleTimeString('ja-JP', { timeZone: 'Asia/Tokyo', hour12: false });
            document.getElementById('ping-num').textContent = (10 + Math.floor(Math.random() * 5)) + 'ms';
        }
        setInterval(refreshClocks, 1000);
        refreshClocks();

        // FLUX DE MARCHÉ COMPLETS ET ACTIFS
        const marketData = [
            { sym: 'BTC/USD', name: 'Bitcoin Core', price: 96850.20, chg: '+3.42%', up: true },
            { sym: 'ETH/USD', name: 'Ethereum', price: 2740.80, chg: '+2.15%', up: true },
            { sym: 'NASDAQ', name: 'US Tech 100', price: 21240.50, chg: '-0.45%', up: false },
            { sym: 'GOLD', name: 'Gold Ounce', price: 2860.10, chg: '+0.88%', up: true },
            { sym: 'EUR/USD', name: 'Euro Dollar', price: 1.0485, chg: '-0.12%', up: false }
        ];

        function initMarketPanel() {
            const container = document.getElementById('ticker-list');
            container.innerHTML = '';
            marketData.forEach((item, idx) => {
                const card = document.createElement('div');
                card.className = 'ticker-row';
                card.innerHTML = `
                    <div>
                        <div class="ticker-sym">${item.sym}</div>
                        <div class="ticker-name">${item.name}</div>
                    </div>
                    <canvas class="sparkline" id="spark-${idx}"></canvas>
                    <div>
                        <div class="price-val" id="price-${idx}">${item.price.toLocaleString()}</div>
                        <div class="price-chg ${item.up ? 'up' : 'down'}">${item.chg}</div>
                    </div>
                `;
                container.appendChild(card);
                drawSparkline(`spark-${idx}`, item.up);
            });
        }

        function drawSparkline(canvasId, isUp) {
            const cvs = document.getElementById(canvasId);
            if (!cvs) return;
            const ctx = cvs.getContext('2d');
            cvs.width = 70; cvs.height = 24;
            ctx.strokeStyle = isUp ? '#00ffaa' : '#ff3366';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            let y = 12;
            ctx.moveTo(0, y);
            for (let x = 5; x <= 70; x += 7) {
                y += (Math.random() - 0.48) * 8;
                y = Math.max(3, Math.min(21, y));
                ctx.lineTo(x, y);
            }
            ctx.stroke();
        }

        initMarketPanel();

        setInterval(() => {
            marketData.forEach((item, i) => {
                const delta = (Math.random() - 0.49) * (item.price * 0.002);
                item.price += delta;
                const el = document.getElementById(`price-${i}`);
                if (el) el.textContent = item.price.toFixed(item.price < 10 ? 4 : 2);
            });
        }, 2000);

        // GÉNÉRATION DE LA TEXTURE DES CONTINENTS DANS UN CANVAS 2D EN TEMPS RÉEL
        function createEarthTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 2048;
            canvas.height = 1024;
            const ctx = canvas.getContext('2d');

            // Fond Océan sombre avec grille
            ctx.fillStyle = '#020916';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Quadrillage de coordonnées
            ctx.strokeStyle = 'rgba(0, 243, 255, 0.12)';
            ctx.lineWidth = 2;
            for (let x = 0; x <= canvas.width; x += 128) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
            }
            for (let y = 0; y <= canvas.height; y += 128) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
            }

            // Dessin holographique des formes continentales
            ctx.fillStyle = 'rgba(0, 243, 255, 0.45)';
            ctx.strokeStyle = '#00f3ff';
            ctx.lineWidth = 4;

            function drawLand(path) {
                ctx.beginPath();
                path.forEach((pt, i) => {
                    const x = (pt[0] + 180) * (canvas.width / 360);
                    const y = (90 - pt[1]) * (canvas.height / 180);
                    if (i === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                });
                ctx.closePath();
                ctx.fill();
                ctx.stroke();
            }

            // Polygones simplifiés des continents principaux
            drawLand([[-130,50],[-120,60],[-70,60],[-60,45],[-80,25],[-105,20],[-120,30]]); // Amérique du Nord
            drawLand([[-80,10],[-50,0],[-40,-15],[-60,-50],[-75,-20],[-80,10]]); // Amérique du Sud
            drawLand([[-10,35],[30,35],[35,60],[20,70],[-10,60]]); // Europe
            drawLand([[-20,35],[45,30],[50,0],[40,-35],[15,-35],[-15,0]]); // Afrique
            drawLand([[40,35],[140,35],[140,70],[80,70],[60,50]]); // Asie
            drawLand([[110,-10],[155,-10],[150,-40],[115,-35]]); // Australie

            return new THREE.CanvasTexture(canvas);
        }

        // SCÈNE THREE.JS AVEC GLOBE CONTINENTAL
        const canvas = document.getElementById('webgl-canvas');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 28);

        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        const globeGroup = new THREE.Group();
        scene.add(globeGroup);

        // Globe avec texture continentale
        const earthGeo = new THREE.SphereGeometry(8.5, 64, 64);
        const earthMat = new THREE.MeshBasicMaterial({
            map: createEarthTexture(),
            transparent: true,
            opacity: 0.9
        });
        const earthMesh = new THREE.Mesh(earthGeo, earthMat);
        globeGroup.add(earthMesh);

        // Halo d'atmosphère externe
        const atmosphereGeo = new THREE.SphereGeometry(8.8, 64, 64);
        const atmosphereMat = new THREE.MeshBasicMaterial({
            color: 0x00f3ff,
            wireframe: true,
            transparent: true,
            opacity: 0.12
        });
        const atmosphere = new THREE.Mesh(atmosphereGeo, atmosphereMat);
        globeGroup.add(atmosphere);

        // Points d'impact lumineux (Capitales boursières)
        function addHubPin(lat, lon) {
            const phi = (90 - lat) * (Math.PI / 180);
            const theta = (lon + 180) * (Math.PI / 180);
            const r = 8.6;

            const x = -(r * Math.sin(phi) * Math.cos(theta));
            const y = r * Math.cos(phi);
            const z = r * Math.sin(phi) * Math.sin(theta);

            const pinGeo = new THREE.SphereGeometry(0.2, 16, 16);
            const pinMat = new THREE.MeshBasicMaterial({ color: 0x00ffaa });
            const pinMesh = new THREE.Mesh(pinGeo, pinMat);
            pinMesh.position.set(x, y, z);
            globeGroup.add(pinMesh);
        }

        addHubPin(48.85, 2.35);   // Paris
        addHubPin(40.71, -74.00); // New York
        addHubPin(35.67, 139.65); // Tokyo

        // ANIMATION & WARP
        let isWarping = false;
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const time = clock.getElapsedTime();

            if (!isWarping) {
                globeGroup.rotation.y = time * 0.1;
            }
            renderer.render(scene, camera);
        }
        animate();

        // DÉCLENCHEMENT DÉTERMINISTE DE L'AUDIO AU CLIC
        document.getElementById('btn-launch').addEventListener('click', () => {
            if (isWarping) return;
            isWarping = true;
            document.body.classList.add('warping');

            // Force la lecture synchrone sur l'action de l'utilisateur
            acdcAudio.currentTime = 0;
            const playPromise = acdcAudio.play();
            if (playPromise !== undefined) {
                playPromise.catch(err => {
                    console.warn("Lecture bloquée par le navigateur :", err);
                });
            }

            const flash = document.getElementById('flash-overlay');
            let startTime = performance.now();

            function warpStep(now) {
                let progress = (now - startTime) / 3200;
                if (progress < 1.0) {
                    camera.position.z = 28 - Math.pow(progress, 3) * 20;
                    camera.fov = 45 + progress * 40;
                    camera.updateProjectionMatrix();
                    globeGroup.rotation.y += progress * 0.25;

                    if (progress > 0.85) {
                        flash.style.opacity = (progress - 0.85) / 0.15;
                    }
                    requestAnimationFrame(warpStep);
                } else {
                    flash.style.opacity = '1';
                    setTimeout(() => {
                        alert('CONNEXION RÉSEAU GLOBAL ÉTABLIE — SYSTÈME PRÊT');
                        location.reload();
                    }, 300);
                }
            }
            requestAnimationFrame(warpStep);
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
